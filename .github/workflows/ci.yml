name: Extension checks

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-agent-extension-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified extension export
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release source
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download tested extension
        run: gh run download "$GITHUB_RUN_ID" --name "paper-agent-extension-$GITHUB_SHA" --dir extension
      - name: Package extension and checksums
        run: |
          mkdir release
          cd extension
          zip -qr "../release/paper-agent-raycast-$RELEASE_TAG.zip" .
          cd ../release
          sha256sum *.zip > SHA256SUMS
      - name: Prepare release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text()
          notes = changelog.split("\n## ", 1)[1].split("\n", 1)[1].split("\n## ", 1)[0]
          notes += "\n\nThis archive is a development export. Raycast Store updates are published separately through the Store review process.\n"
          Path("release-notes.md").write_text(notes.strip() + "\n")
          PY
      - name: Publish release and assets
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "Paper Agent Raycast $RELEASE_TAG" --notes-file release-notes.md
